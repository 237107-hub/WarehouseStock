name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install SDK and NET 8 runtime
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Restore locked dependencies and audit
        run: dotnet restore --locked-mode
      - name: Verify formatting and analyzers
        run: dotnet format --verify-no-changes --no-restore
      - name: Build Release
        run: dotnet build -c Release --no-restore
      - name: Tests and Core coverage gate
        run: >-
          dotnet test -c Release --no-build --no-restore
          --logger trx --results-directory artifacts/test-results
          /p:CollectCoverage=true /p:CoverletOutput=./coverage/
          /p:CoverletOutputFormat=cobertura
          /p:Include="[WarehouseStock.Core]*"
          /p:ExcludeByAttribute=GeneratedCodeAttribute%2cCompilerGeneratedAttribute
          /p:Threshold=80 /p:ThresholdType=line
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/test-results/**/*.trx
            **/coverage/coverage.cobertura.xml
